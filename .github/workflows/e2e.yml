name: e2e

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# All runs share the same two Microsoft test mailboxes, so they must not overlap.
concurrency:
  group: mscal-e2e
  cancel-in-progress: false

jobs:
  playwright:
    name: Playwright against Microsoft Entra ID
    # Secrets are not available to pull requests from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: e2e-entra
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      E2E_DIR: e2e/playwright
      MSCAL_E2E_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      MSCAL_E2E_TENANT_ID: ${{ secrets.MSCAL_E2E_TENANT_ID }}
      MSCAL_E2E_CLIENT_ID: ${{ secrets.MSCAL_E2E_CLIENT_ID }}
      MSCAL_E2E_CLIENT_SECRET: ${{ secrets.MSCAL_E2E_CLIENT_SECRET }}
      MSCAL_E2E_USER1_EMAIL: ${{ secrets.MSCAL_E2E_USER1_EMAIL }}
      MSCAL_E2E_USER1_PASSWORD: ${{ secrets.MSCAL_E2E_USER1_PASSWORD }}
      MSCAL_E2E_USER2_EMAIL: ${{ secrets.MSCAL_E2E_USER2_EMAIL }}
      MSCAL_E2E_USER2_PASSWORD: ${{ secrets.MSCAL_E2E_USER2_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            e2e/playwright/package-lock.json

      # Runs in the background so the image pull overlaps with the plugin build.
      - name: Start Mattermost
        run: |
          (make e2e-start > "$RUNNER_TEMP/server-up.log" 2>&1; echo $? > "$RUNNER_TEMP/server-up.exit") &

      - name: Build the plugin bundle
        run: make dist

      - name: Install E2E dependencies
        run: |
          cd "$E2E_DIR"
          npm ci
          npx playwright install --with-deps chromium

      - name: Type-check the suite
        run: |
          cd "$E2E_DIR"
          npm run tsc

      - name: Wait for Mattermost to be healthy
        timeout-minutes: 10
        run: |
          while [ ! -f "$RUNNER_TEMP/server-up.exit" ]; do sleep 5; done
          cat "$RUNNER_TEMP/server-up.log"
          exit "$(cat "$RUNNER_TEMP/server-up.exit")"

      - name: Run the suite
        run: |
          cd "$E2E_DIR"
          npm test

      - name: Collect container logs
        if: failure()
        run: |
          cd "$E2E_DIR"
          mkdir -p results
          docker compose ps -a > results/containers.txt
          docker compose logs --no-color > results/containers.log

      - name: Upload results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e/playwright/results
          retention-days: 14

      # Global teardown already does this. This covers a crashed or cancelled run.
      - name: Delete this run's calendar events
        if: always()
        run: |
          cd "$E2E_DIR"
          npm run cleanup -- --run-id "$MSCAL_E2E_RUN_ID"

      - name: Stop Mattermost
        if: always()
        run: make e2e-stop
