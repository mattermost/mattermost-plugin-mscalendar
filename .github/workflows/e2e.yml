name: e2e

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright against the fake Microsoft services
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      E2E_DIR: e2e/playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            e2e/playwright/package-lock.json

      # Runs in the background so the image pull overlaps with the plugin build.
      - name: Start Mattermost
        run: |
          (make e2e-env-up > "$RUNNER_TEMP/server-up.log" 2>&1; echo $? > "$RUNNER_TEMP/server-up.exit") &

      - name: Build the plugin bundle
        run: make dist

      - name: Install E2E dependencies
        run: |
          cd "$E2E_DIR"
          npm ci
          npx playwright install --with-deps chromium

      - name: Type-check the suite
        run: |
          cd "$E2E_DIR"
          npm run tsc

      - name: Wait for Mattermost to be healthy
        timeout-minutes: 10
        run: |
          while [ ! -f "$RUNNER_TEMP/server-up.exit" ]; do sleep 5; done
          cat "$RUNNER_TEMP/server-up.log"
          exit "$(cat "$RUNNER_TEMP/server-up.exit")"

      - name: Run the suite
        run: |
          cd "$E2E_DIR"
          npm test

      - name: Collect container logs
        if: failure()
        run: |
          cd "$E2E_DIR"
          mkdir -p results
          docker compose ps -a > results/containers.txt
          docker compose logs --no-color > results/containers.log

      - name: Upload results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e/playwright/results
          retention-days: 14

      - name: Stop Mattermost
        if: always()
        run: make e2e-env-down
