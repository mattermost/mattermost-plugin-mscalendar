name: e2e-cleanup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mscal-e2e
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete leftover E2E calendar events
    runs-on: ubuntu-latest
    environment: e2e-entra
    timeout-minutes: 10
    env:
      MSCAL_E2E_TENANT_ID: ${{ secrets.MSCAL_E2E_TENANT_ID }}
      MSCAL_E2E_CLIENT_ID: ${{ secrets.MSCAL_E2E_CLIENT_ID }}
      MSCAL_E2E_CLIENT_SECRET: ${{ secrets.MSCAL_E2E_CLIENT_SECRET }}
      MSCAL_E2E_USER1_EMAIL: ${{ secrets.MSCAL_E2E_USER1_EMAIL }}
      MSCAL_E2E_USER1_PASSWORD: ${{ secrets.MSCAL_E2E_USER1_PASSWORD }}
      MSCAL_E2E_USER2_EMAIL: ${{ secrets.MSCAL_E2E_USER2_EMAIL }}
      MSCAL_E2E_USER2_PASSWORD: ${{ secrets.MSCAL_E2E_USER2_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/playwright/package-lock.json

      - name: Delete [e2e-*] events older than 24 hours
        run: |
          cd e2e/playwright
          npm ci
          npm run cleanup
