version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    govet:
      disable:
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: redefines-builtin-id
          disabled: true
    staticcheck:
      checks: ["all", "-QF1001", "-QF1002", "-QF1003", "-QF1004", "-QF1006", "-QF1007", "-QF1008", "-QF1011", "-QF1012"]
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goconst
          - gosec
        path: _test\.go
      - linters:
          - errcheck
        path: (calendar|msgraph)/
      - linters:
          - revive
        text: unused-parameter
      - linters:
          - revive
        text: var-naming
      - linters:
          - staticcheck
        text: SA1019
      - linters:
          - gosec
        text: G104
      - linters:
          - gosec
        text: G304
      - linters:
          - gosec
        text: G301
      - path: (.+)\.go$
        text: 'shadow: declaration of "err" shadows declaration at'
    paths:
      - server/manifest.go
      - build/
      - webapp/node_modules/

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - server/manifest.go
      - build/
      - webapp/node_modules/
